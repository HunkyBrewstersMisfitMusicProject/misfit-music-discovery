<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misfit Music Project — Open Discovery</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto;
         padding: 0 1rem; color: #111; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  .tag { display: inline-block; background: #eee; border-radius: 4px;
         padding: 1px 6px; font-size: .8rem; margin: 2px; }
  input { width: 100%; padding: .5rem; font-size: 1rem; margin-bottom: 1rem;
          box-sizing: border-box; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: .75rem 1rem;
          margin-bottom: .75rem; }
  a { color: #0a6; }
  .curator { background: #faf6ff; }
  .note { font-size: .85rem; color: #666; }
  .bio { margin: .4rem 0; }
  .links a { display: inline-block; margin: 2px 8px 2px 0; font-size: .92rem; }
  .preview { margin-top: .5rem; }
  .preview audio { width: 100%; height: 36px; }
  .muted { color: #999; font-size: .78rem; }
  #status { color: #666; font-style: italic; }
</style>
</head>
<body>
<h1>Misfit Music Project — Open Discovery</h1>
<p class="note">An open, non-tiered discovery index. Artists own their manifests;
curators help listeners find them. No account, no tier, no cost.
<a href="registry.json">registry.json</a></p>
<input id="q" placeholder="Search by name, genre, city, or curator…" autocomplete="off">
<div id="status">Loading manifests…</div>
<div id="out"></div>
<script>
"use strict";

// Build a card from a manifest object (artist) or a curator object.
function buildCard(x) {
  const div = document.createElement("div");
  div.className = "card" + (x.type === "curator" ? " curator" : "");

  const name = document.createElement("strong");
  name.textContent = x.name || "(unnamed)";
  div.appendChild(name);

  if (x.location) {
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = x.location;
    div.appendChild(t);
  }

  for (const g of (x.genres || [])) {
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = g;
    div.appendChild(t);
  }

  if (x.type === "curator") {
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = "playlist curator";
    div.appendChild(t);
  }

  if (x.bio) {
    const b = document.createElement("div");
    b.className = "bio";
    b.textContent = x.bio;
    div.appendChild(b);
  }

  if (x.type === "curator" && x.blurb) {
    const b = document.createElement("div");
    b.className = "note";
    b.textContent = x.blurb;
    div.appendChild(b);
  }

  // Links: prefer curators' playlists, else the manifest's links array.
  const links = x.type === "curator"
    ? (x.playlists || []).map(p => ({ kind: p.platform || "playlist", url: p.url, label: p.title }))
    : (x.links || []);

  if (links.length) {
    const lw = document.createElement("div");
    lw.className = "links";
    for (const l of links) {
      const a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = l.label || l.kind || "link";
      lw.appendChild(a);
    }
    div.appendChild(lw);
  }

  if (x.contact) {
    const c = document.createElement("div");
    c.className = "note";
    const a = document.createElement("a");
    a.href = "mailto:" + x.contact;
    a.textContent = "contact: " + x.contact;
    c.appendChild(a);
    div.appendChild(c);
  }

  // Preview: only surfaces a player if the referenced file actually loads.
  // Artists add a clip by dropping previews/<name>.wav (or .mp3) and setting
  // the "preview" field in their manifest — no code change required.
  if (x.preview) {
    const wrap = document.createElement("div");
    wrap.className = "preview";
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = x.preview;

    const pending = document.createElement("span");
    pending.className = "muted";
    pending.textContent = "preview pending";

    // If the clip isn't there yet, don't show a broken player — just a note.
    audio.addEventListener("error", () => {
      wrap.innerHTML = "";
      wrap.appendChild(pending);
    });

    wrap.appendChild(audio);
    div.appendChild(wrap);
  }

  if (x.generated_at) {
    const m = document.createElement("div");
    m.className = "muted";
    m.textContent = "manifest updated " + x.generated_at.slice(0, 10);
    div.appendChild(m);
  }

  return div;
}

function render(items, q) {
  q = (q || "").toLowerCase().trim();
  const out = document.getElementById("out");
  out.innerHTML = "";
  let shown = 0;
  for (const x of items) {
    const hay = [
      x.name, x.location,
      (x.genres || []).join(" "),
      x.bio || "", x.blurb || ""
    ].join(" ").toLowerCase();
    if (q && !hay.includes(q)) continue;
    out.appendChild(buildCard(x));
    shown++;
  }
  const status = document.getElementById("status");
  if (shown === 0) {
    status.textContent = q ? "No matches for “" + q + "”." : "No entries.";
  } else {
    status.textContent = shown + " of " + items.length + " shown" +
      (q ? " (filtered)" : "");
  }
}

async function loadData() {
  const items = [];

  // Artists: registry.json lists manifest filenames; each is fetched live.
  try {
    const reg = await fetch("registry.json").then(r => r.json());
    const manifests = await Promise.all(reg.map(f =>
      fetch(f).then(r => r.json()).catch(err => ({ __error: f, __msg: String(err) }))
    ));
    for (const m of manifests) {
      if (m && m.name && !m.__error) {
        items.push(Object.assign({ type: "artist" }, m));
      } else if (m && m.__error) {
        console.warn("Failed to load manifest:", m.__error, m.__msg);
      }
    }
  } catch (err) {
    console.error("registry.json load failed:", err);
  }

  // Curators.
  try {
    const curators = await fetch("curators.json").then(r => r.json());
    for (const c of curators || []) {
      items.push(Object.assign({ type: "curator" }, c));
    }
  } catch (err) {
    console.warn("curators.json load failed:", err);
  }

  return items;
}

(async function init() {
  const items = await loadData();
  const q = document.getElementById("q");
  q.addEventListener("input", e => render(items, e.target.value));
  render(items, "");
})();
</script>
</body>
</html>
